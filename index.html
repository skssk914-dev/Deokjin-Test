<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 시정표 위젯</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #2563eb;
            --active-color: #16a34a;
            --prep-color: #d97706;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* 상단 헤더 및 컨트롤러 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1.2rem 2rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        /* 레이아웃 메인 */
        main {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 1.5rem;
            flex: 1;
        }

        /* 왼쪽: 시간표 카드 목록 */
        .schedule-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .day-section {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 1.2rem 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .day-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .period-table {
            width: 100%;
            border-collapse: collapse;
        }

        .period-table th, .period-table td {
            padding: 0.8rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .period-table th {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 600;
            background-color: #f1f5f9;
        }

        .period-table td {
            font-size: 1.1rem;
        }

        /* 현재 진행 중인 교시 강조 스타일 */
        .status-active {
            background-color: #f0fdf4 !important;
            border-left: 5px solid var(--active-color);
        }

        .status-prep {
            background-color: #fefce8 !important;
            border-left: 5px solid var(--prep-color);
        }

        /* 오른쪽: 대형 시계 위젯 패널 */
        .clock-panel {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem 2rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .clock-label {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        /* 매우 큰 현재 시간 디스플레이 */
        .big-clock {
            font-size: 5rem;
            font-weight: 900;
            color: var(--text-primary);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: -2px;
            background: #f1f5f9;
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            border: 2px solid var(--border-color);
            width: 100%;
            box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.05);
        }

        .lunch-info {
            margin-top: 2.5rem;
            width: 100%;
            background-color: #f8fafc;
            padding: 1.2rem;
            border-radius: 0.8rem;
            border: 1px solid var(--border-color);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">2026학년도 1학기 2차 정기시험</div>
        <div class="controls">
            <label for="gradeSelect" style="font-size: 1.2rem; font-weight: 700;">학년 선택: </label>
            <select id="gradeSelect" onchange="renderSchedule()">
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3" selected>3학년</option>
            </select>
        </div>
    </header>

    <main>
        <!-- 전체 시험 일정 테이블 -->
        <div class="schedule-container" id="scheduleContainer">
            <!-- 자바스크립트로 자동 생성 -->
        </div>

        <!-- 우측: 대형 시계 위젯 -->
        <div class="clock-panel">
            <div class="clock-label">현재 시간</div>
            <div class="big-clock" id="bigClock">00:00:00</div>
            <div class="lunch-info" id="lunchInfo">
                <strong style="color: var(--accent-color);">점심시간 안내</strong>
                <div id="lunchDetails" style="margin-top: 0.5rem; color: var(--text-secondary); font-weight: 600;">
                    -
                </div>
            </div>
        </div>
    </main>

    <script>
        // PDF 데이터 기반 시간표 설정
        const examData = [
            {
                date: "2026-07-01",
                dayName: "7. 1.(수)",
                lunch: { 1: "11:50", 2: "12:10 (3교시 12:30)", 3: "12:10" },
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "수학(04)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "기술·가정(06)" }
                    }
                ]
            },
            {
                date: "2026-07-02",
                dayName: "7. 2.(목)",
                lunch: { 1: "11:50", 2: "12:10", 3: "12:30" },
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "AI 중점학교", 2: "자율 / 사회(03)", 3: "국어(01)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "운영수업", 2: "사회(03)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "역사(16)" }
                    }
                ]
            },
            {
                date: "2026-07-03",
                dayName: "7. 3.(금)",
                lunch: { 1: "11:50", 2: "12:10", 3: "12:30" },
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "평화공존 교육", 2: "자율 / 도덕(02)", 3: "영어(10)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "자유학기 주제선택", 2: "도덕(02)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "주제선택 (3,4교시)", 2: "-", 3: "과학(05)" }
                    }
                ]
            }
        ];

        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('bigClock').innerText = timeStr;
            checkActivePeriod(now);
        }

        function renderSchedule() {
            const grade = document.getElementById('gradeSelect').value;
            const container = document.getElementById('scheduleContainer');
            container.innerHTML = '';

            examData.forEach(day => {
                let html = `
                    <div class="day-section">
                        <div class="day-title">
                            <span>${day.dayName}</span>
                            <span style="font-size: 0.95rem; color: var(--text-secondary);">점심시간: ${day.lunch[grade]}</span>
                        </div>
                        <table class="period-table">
                            <thead>
                                <tr>
                                    <th>교시</th>
                                    <th>준비시간</th>
                                    <th>시험시간</th>
                                    <th>과목</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                day.periods.forEach(p => {
                    const subject = p.subjects[grade] || '-';
                    html += `
                        <tr id="row-${day.date}-${p.period}">
                            <td><strong>${p.period}</strong></td>
                            <td>${p.prep}</td>
                            <td>${p.exam}</td>
                            <td><strong>${subject}</strong></td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function checkActivePeriod(now) {
            const grade = document.getElementById('gradeSelect').value;
            const currentDateStr = now.toISOString().split('T')[0];
            const currentTimeStr = now.toTimeString().substring(0, 5);

            let currentDay = examData.find(d => d.date === currentDateStr);
            if (!currentDay) currentDay = examData[0]; // 시연용 기본값 설정

            document.getElementById('lunchDetails').innerText = `${grade}학년 점심시간 시작: ${currentDay.lunch[grade]}`;

            document.querySelectorAll('.period-table tr').forEach(r => r.classList.remove('status-active', 'status-prep'));

            for (let p of currentDay.periods) {
                // 준비시간 하이라이트
                if (currentTimeStr >= p.startTime && currentTimeStr < p.prepEndTime) {
                    highlightRow(currentDay.date, p.period, "status-prep");
                    break;
                } 
                // 시험시간 하이라이트
                else if (currentTimeStr >= p.prepEndTime && currentTimeStr < p.endTime) {
                    highlightRow(currentDay.date, p.period, "status-active");
                    break;
                }
            }
        }

        function highlightRow(date, period, className) {
            const row = document.getElementById(`row-${date}-${period}`);
            if (row) row.classList.add(className);
        }

        // 초기화
        renderSchedule();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
