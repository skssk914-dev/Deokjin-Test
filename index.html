<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시험 시정표 위젯</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-color: #2563eb;
            --active-color: #16a34a;
            --prep-color: #d97706;
            --border-color: #cbd5e1;
            --shadow: 0 4px 10px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        /* 상단 헤더 및 컨트롤러 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 1.2rem 2rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-group label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 0.5rem;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        /* 레이아웃 메인 */
        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        /* 왼쪽: 시간표 및 탭 영역 */
        .schedule-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 교시 선택 탭 */
        .period-tabs {
            display: flex;
            gap: 0.5rem;
            background-color: var(--card-bg);
            padding: 0.5rem;
            border-radius: 0.8rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            background-color: transparent;
            color: var(--text-secondary);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            background-color: #f1f5f9;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .day-section {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            flex: 1;
        }

        .day-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 0.8rem;
        }

        .period-table {
            width: 100%;
            border-collapse: collapse;
        }

        .period-table th, .period-table td {
            padding: 1.2rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .period-table th {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 700;
            background-color: #f1f5f9;
        }

        .period-table td {
            font-size: 1.25rem;
        }

        /* 현재 진행 중인 교시 강조 스타일 */
        .status-active {
            background-color: #f0fdf4 !important;
            border-left: 6px solid var(--active-color);
        }

        .status-prep {
            background-color: #fefce8 !important;
            border-left: 6px solid var(--prep-color);
        }

        /* 오른쪽: 대형 시계 위젯 패널 */
        .clock-panel {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2.5rem 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .clock-label {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        /* 2배 확대된 현재 시간 디스플레이 (기존 5rem -> 10rem) */
        .big-clock {
            font-size: 10rem;
            font-weight: 900;
            color: var(--text-primary);
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: -4px;
            line-height: 1.0;
            background: #f1f5f9;
            padding: 2rem 1rem;
            border-radius: 1.2rem;
            border: 3px solid var(--border-color);
            width: 100%;
            box-shadow: inset 0 2px 6px 0 rgba(0,0,0,0.08);
            margin: 0.5rem 0;
        }

        .lunch-info {
            margin-top: 2rem;
            width: 100%;
            background-color: #f8fafc;
            padding: 1.2rem;
            border-radius: 0.8rem;
            border: 1px solid var(--border-color);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">2026학년도 1학기 2차 정기시험</div>
        <div class="controls">
            <div class="control-group">
                <label for="daySelect">시험일:</label>
                <select id="daySelect" onchange="renderSchedule()">
                    <option value="2026-07-01">1일차 (7. 1. 수)</option>
                    <option value="2026-07-02">2일차 (7. 2. 목)</option>
                    <option value="2026-07-03">3일차 (7. 3. 금)</option>
                </select>
            </div>
            <div class="control-group">
                <label for="gradeSelect">학년:</label>
                <select id="gradeSelect" onchange="renderSchedule()">
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3" selected>3학년</option>
                </select>
            </div>
        </div>
    </header>

    <main>
        <!-- 왼쪽: 시험 일정 테이블 및 교시 필터 -->
        <div class="schedule-container">
            <!-- 교시 선택 탭 -->
            <div class="period-tabs">
                <button class="tab-btn active" onclick="setPeriodFilter('all', this)">전체 교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('1교시', this)">1교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('2교시', this)">2교시</button>
                <button class="tab-btn" onclick="setPeriodFilter('3교시', this)">3교시</button>
            </div>

            <!-- 특정 일자 시험 일정 카드 -->
            <div id="scheduleContainer">
                <!-- 자바스크립트로 자동 생성 -->
            </div>
        </div>

        <!-- 우측: 대형 시계 위젯 (2배 확대) -->
        <div class="clock-panel">
            <div class="clock-label">현재 시간</div>
            <div class="big-clock" id="bigClock">00:00:00</div>
            <div class="lunch-info" id="lunchInfo">
                <strong style="color: var(--accent-color);">점심시간 안내</strong>
                <div id="lunchDetails" style="margin-top: 0.5rem; color: var(--text-secondary); font-weight: 700;">
                    -
                </div>
            </div>
        </div>
    </main>

    <script>
        // PDF 데이터 기반 시간표 설정
        const examData = [
            {
                date: "2026-07-01",
                dayName: "7. 1.(수)",
                lunch: { 1: "11:50", 2: "12:10 (3교시 12:30)", 3: "12:10" },
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "수학(04)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "교과융합수업", 2: "한문(11) / 중국어(13)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "기술·가정(06)" }
                    }
                ]
            },
            {
                date: "2026-07-02",
                dayName: "7. 2.(목)",
                lunch: { 1: "11:50", 2: "12:10", 3: "12:30" },
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "AI 중점학교", 2: "자율 / 사회(03)", 3: "국어(01)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "운영수업", 2: "사회(03)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "-", 2: "-", 3: "역사(16)" }
                    }
                ]
            },
            {
                date: "2026-07-03",
                dayName: "7. 3.(금)",
                lunch: { 1: "11:50", 2: "12:10", 3: "12:30" },
                periods: [
                    {
                        period: "1교시",
                        prep: "09:00~09:05",
                        exam: "09:05~09:50",
                        startTime: "09:00", endTime: "09:50", prepEndTime: "09:05",
                        subjects: { 1: "평화공존 교육", 2: "자율 / 도덕(02)", 3: "영어(10)" }
                    },
                    {
                        period: "2교시",
                        prep: "10:00~10:05",
                        exam: "10:05~10:50",
                        startTime: "10:00", endTime: "10:50", prepEndTime: "10:05",
                        subjects: { 1: "자유학기 주제선택", 2: "도덕(02)", 3: "자율" }
                    },
                    {
                        period: "3교시",
                        prep: "11:00~11:05",
                        exam: "11:05~11:50",
                        startTime: "11:00", endTime: "11:50", prepEndTime: "11:05",
                        subjects: { 1: "주제선택 (3,4교시)", 2: "-", 3: "과학(05)" }
                    }
                ]
            }
        ];

        let selectedPeriodFilter = 'all';

        function initDateSelect() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const daySelect = document.getElementById('daySelect');
            
            // 오늘 날짜가 시험 일정에 포함되어 있다면 해당 일자로 초기 선택
            if (examData.some(d => d.date === todayStr)) {
                daySelect.value = todayStr;
            }
        }

        function setPeriodFilter(period, btn) {
            selectedPeriodFilter = period;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSchedule();
        }

        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('bigClock').innerText = timeStr;
            checkActivePeriod(now);
        }

        function renderSchedule() {
            const grade = document.getElementById('gradeSelect').value;
            const selectedDate = document.getElementById('daySelect').value;
            const container = document.getElementById('scheduleContainer');
            
            const currentDay = examData.find(d => d.date === selectedDate) || examData[0];

            // 교시 필터 적용
            const filteredPeriods = currentDay.periods.filter(p => {
                if (selectedPeriodFilter === 'all') return true;
                return p.period === selectedPeriodFilter;
            });

            let html = `
                <div class="day-section">
                    <div class="day-title">
                        <span>${currentDay.dayName} 시험 일정</span>
                        <span style="font-size: 1.05rem; color: var(--text-secondary);">점심시간: ${currentDay.lunch[grade]}</span>
                    </div>
                    <table class="period-table">
                        <thead>
                            <tr>
                                <th>교시</th>
                                <th>준비시간</th>
                                <th>시험시간</th>
                                <th>과목</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            filteredPeriods.forEach(p => {
                const subject = p.subjects[grade] || '-';
                html += `
                    <tr id="row-${currentDay.date}-${p.period}">
                        <td><strong>${p.period}</strong></td>
                        <td>${p.prep}</td>
                        <td>${p.exam}</td>
                        <td><strong>${subject}</strong></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;
            
            container.innerHTML = html;
            
            // 시간 표시 및 하이라이트 갱신
            checkActivePeriod(new Date());
        }

        function checkActivePeriod(now) {
            const grade = document.getElementById('gradeSelect').value;
            const selectedDate = document.getElementById('daySelect').value;
            const currentTimeStr = now.toTimeString().substring(0, 5);

            const currentDay = examData.find(d => d.date === selectedDate);
            if (currentDay) {
                document.getElementById('lunchDetails').innerText = `${grade}학년 점심시간 시작: ${currentDay.lunch[grade]}`;
            }

            document.querySelectorAll('.period-table tr').forEach(r => r.classList.remove('status-active', 'status-prep'));

            if (currentDay) {
                for (let p of currentDay.periods) {
                    // 준비시간 하이라이트
                    if (currentTimeStr >= p.startTime && currentTimeStr < p.prepEndTime) {
                        highlightRow(currentDay.date, p.period, "status-prep");
                        break;
                    } 
                    // 시험시간 하이라이트
                    else if (currentTimeStr >= p.prepEndTime && currentTimeStr < p.endTime) {
                        highlightRow(currentDay.date, p.period, "status-active");
                        break;
                    }
                }
            }
        }

        function highlightRow(date, period, className) {
            const row = document.getElementById(`row-${date}-${period}`);
            if (row) row.classList.add(className);
        }

        // 초기화
        initDateSelect();
        renderSchedule();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
